
num_users: 8
num_arrays: 4
# Heterogeneous Panels Configuration
num_elements_regular: 8      # Broader beam, lower gain (Group A)
num_elements_irregular: 16   # Pencil beam, higher gain (Group B)
conflict_threshold_deg: 20   # Spatial conflict matrix threshold
max_episode_time: 30
uav_speed: 30
uav_height: 50
max_range: 500
bandwidth: 0.35
sinr_threshold_db: 3
switch_cost: 0.25
operation_mode: multi   # 'single': all arrays → one user | 'multi': each array independent
# UAV transmitter power and user receive gain (for link budget).
# 43 dBm (20 W) models a research-grade drone relay at 28 GHz overcoming severe NLoS path loss.
# Lower to 33 dBm (2 W) for battery-constrained indoor scenarios.
tx_power_dbm: 43
rx_gain_dbi: 0

# Ablation Testing
enable_spatial_masking: false # If false, only masks out users that are already satisfied
enable_reward_weighted_positioning: true # If true, UAV mobility is guided by user urgency weights

# H-MARL Architecture
h_marl_mode: false       # Strategist assigns sectors instead of specific users
num_sectors: 4          # Number of angular sectors (e.g. 0-90, 90-180, etc.)
